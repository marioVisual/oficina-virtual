<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Claude Office — VisualNacert</title>
<style>
:root{
  --bg:#07080d;--bg2:#0b0d14;--bg3:#0f1220;--inp:#161826;
  --b:#1c2038;--bhi:#2c3055;
  --green:#1adb8a;--blue:#4a8fff;--amber:#f0a020;--red:#e24b4a;
  --purple:#a78bfa;--cyan:#22d3ee;--pink:#f472b6;
  --text:#e2e5f0;--dim:#4a5070;--mid:#8890b0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;display:flex;flex-direction:column}

/* TOPBAR */
#topbar{height:30px;background:#05060b;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;z-index:100}
.dots{display:flex;gap:5px}.dot{width:10px;height:10px;border-radius:50%}
#t-title{font-size:9px;color:var(--dim);letter-spacing:3px}
#t-right{display:flex;align-items:center;gap:10px}
#live-badge{display:flex;align-items:center;gap:5px;font-size:8px;color:var(--green)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
#cfg-btn{font-size:8px;color:var(--dim);text-decoration:none;padding:2px 7px;border:0.5px solid var(--b);border-radius:8px}
#cfg-btn:hover{color:var(--text)}

/* MAIN */
#main{display:flex;flex:1;overflow:hidden;min-height:0}

/* LEFT NAV */
#dept-nav{width:148px;background:#05060b;border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#dept-nav-title{font-size:7px;color:var(--dim);letter-spacing:2px;padding:10px 12px 6px;text-transform:uppercase}
.dept-all{display:flex;align-items:center;gap:7px;padding:7px 12px 10px;cursor:pointer;border:none;background:transparent;width:100%;font-family:'Courier New',monospace;border-bottom:1px solid var(--b);margin-bottom:4px}
.dept-all:hover{background:var(--bg3)}
.dept-all.sel{background:var(--bg3)}
.dept-all span{font-size:9px;color:var(--green)}
.dept-btn{display:flex;align-items:center;gap:7px;padding:7px 12px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:'Courier New',monospace;border-left:2px solid transparent;transition:all .1s}
.dept-btn:hover{background:var(--bg3)}
.dept-btn.sel{background:var(--bg3);border-left-color:var(--dc)}
.d-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.d-name{font-size:9px;color:var(--mid);flex:1}
.d-name.hi{color:var(--text);font-weight:bold}
.d-cnt{font-size:7px;color:var(--dim)}

/* CENTER: office */
#office-wrap{flex:1;position:relative;overflow:hidden;background:#08091a;min-width:0}

/* OVERVIEW */
#overview{position:absolute;inset:0;overflow:auto;display:grid;place-items:center;padding:20px}
#overview-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1200px}
.room-card{
  cursor:pointer;border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  transition:transform .18s, box-shadow .18s;
  position:relative;flex-shrink:0;
}
.room-card:hover{transform:scale(1.04);box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.room-card-img{width:280px;height:180px;object-fit:cover;display:block;image-rendering:pixelated}
.room-card-fallback{width:280px;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px}
.room-card-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(5,6,11,0.88);padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
.room-card-name{font-size:10px;font-weight:bold;letter-spacing:1px}
.room-card-cnt{font-size:9px;color:var(--mid)}
.room-card-dots{position:absolute;top:8px;right:8px;display:flex;gap:3px;flex-wrap:wrap;max-width:60px}
.room-dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 4px currentColor}

/* ROOM VIEW */
#room-view{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  background:#08091a;
}
#room-view.on{display:flex}
#room-scene{
  flex:1;position:relative;overflow:hidden;min-height:0;
}
#room-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;image-rendering:pixelated;
  display:none;
}
#room-bg-img.on{display:block}
#room-bg-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
#room-bg-fallback.hidden{display:none}
#sprites-layer{
  position:absolute;inset:0;
  /* agents rendered here */
}
#room-topbar{
  position:absolute;top:10px;left:10px;z-index:20;
  display:flex;align-items:center;gap:8px;
}
#back-btn{
  font-size:9px;color:var(--text);background:rgba(5,6,11,0.92);
  border:0.5px solid var(--bhi);border-radius:6px;padding:5px 12px;
  cursor:pointer;font-family:'Courier New',monospace;
}
#back-btn:hover{background:var(--bg3)}
#room-label{font-size:11px;font-weight:bold;padding:5px 14px;border-radius:6px;background:rgba(5,6,11,0.88);border:0.5px solid}

/* AGENT INFO PANEL */
#ap{
  position:absolute;left:10px;bottom:10px;width:300px;
  background:rgba(5,6,11,0.97);border:1px solid var(--bhi);
  border-radius:10px;padding:14px 16px;
  display:none;z-index:30;backdrop-filter:blur(8px)
}
#ap.on{display:block}
#ap-dept{font-size:8px;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px;font-weight:bold}
#ap-name{font-size:13px;font-weight:bold;margin-bottom:3px}
#ap-persona{font-size:9px;color:var(--mid);margin-bottom:8px}
#ap-desc{font-size:10px;color:var(--mid);line-height:1.7;margin-bottom:6px}
#ap-link{font-size:9px;color:var(--blue);text-decoration:none;display:none}
#ap-link:hover{text-decoration:underline}
#ap-close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--dim);background:none;border:none;font-size:16px}

/* AGENT SPRITES */
.agent-wrap{
  position:absolute;
  cursor:pointer;
  text-align:center;
  transform:translate(-50%,-100%);
  transition:filter .15s;
  z-index:10;
}
.agent-wrap:hover .agent-img{filter:brightness(1.2) drop-shadow(0 0 8px rgba(255,255,255,0.4))}
.agent-wrap.sel .agent-img{filter:drop-shadow(0 0 12px var(--glow)) brightness(1.1)}
.agent-wrap:not(.sel).dimmed .agent-img{filter:brightness(0.5)}
.agent-img{
  display:block;
  image-rendering:pixelated;
  margin:0 auto;
  animation:bob 2.5s ease-in-out infinite;
}
.agent-img:nth-of-type(2n){animation-delay:.8s}
.agent-name{
  display:inline-block;font-size:8px;font-family:'Courier New',monospace;
  font-weight:bold;padding:2px 6px;border-radius:3px;
  background:rgba(5,6,11,0.88);border:0.5px solid;
  white-space:nowrap;margin-top:4px;
}

/* CHAT */
#sidebar{width:280px;display:flex;flex-direction:column;background:#07080d;border-left:1px solid var(--b);flex-shrink:0}
#chat-hdr{padding:10px 12px;border-bottom:1px solid var(--b);background:#05060b;flex-shrink:0}
#chat-hdr span{font-size:10px;font-weight:bold}
#chat-hdr p{font-size:8px;color:var(--dim);margin-top:2px}
#messages{flex:1;overflow-y:auto;padding:10px 10px 4px;display:flex;flex-direction:column}
.msg{display:flex;flex-direction:column;margin-bottom:10px}
.msg.user{align-items:flex-end}.msg.assistant{align-items:flex-start}
.msg-meta{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.msg-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px}
.msg-who{font-size:9px;font-weight:bold}
.msg-body{max-width:93%;padding:8px 11px;font-size:11px;line-height:1.65;border-radius:10px;white-space:pre-wrap;font-family:'Courier New',monospace}
.msg.assistant .msg-body{background:#0e1020;border:0.5px solid var(--b);border-radius:2px 10px 10px 10px;color:var(--text)}
.msg.user .msg-body{background:rgba(26,219,138,0.1);border:0.5px solid rgba(26,219,138,0.25);border-radius:10px 10px 2px 10px;color:var(--text)}
.msg-err{background:rgba(226,75,74,0.1)!important;border-color:rgba(226,75,74,0.3)!important;color:#e24b4a!important}
#inp-wrap{padding:8px 10px;border-top:1px solid var(--b);background:#05060b;display:flex;gap:6px;align-items:flex-end;flex-shrink:0}
#inp{flex:1;background:var(--inp);border:0.5px solid var(--bhi);border-radius:6px;color:var(--text);font-size:10px;padding:6px 8px;resize:none;font-family:'Courier New',monospace;line-height:1.4}
#inp:focus{outline:none;border-color:var(--green)}
#send{width:30px;height:30px;border-radius:6px;background:var(--green);border:none;cursor:pointer;color:#050810;font-size:15px;font-weight:bold;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#send:disabled{background:var(--bg3);color:var(--dim);cursor:not-allowed}

#conn-badge{position:absolute;top:8px;right:10px;font-size:8px;padding:3px 9px;border-radius:8px;background:rgba(5,6,11,0.9);border:0.5px solid var(--b);z-index:50}
#conn-badge.ok{color:var(--green);border-color:#0a4a30}
#conn-badge.err{color:var(--red);border-color:var(--red)}

@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bhi);border-radius:2px}
</style>
</head>
<body>
<div id="topbar">
  <div class="dots">
    <div class="dot" style="background:#e24b4a"></div>
    <div class="dot" style="background:#f0a020"></div>
    <div class="dot" style="background:#1adb8a"></div>
  </div>
  <span id="t-title">VISUALNACERT · AGENT OFFICE</span>
  <div id="t-right">
    <div id="live-badge"><div class="pulse"></div><span id="live-txt">0 agentes</span></div>
    <a href="/setup.html" id="cfg-btn">⚙ config</a>
  </div>
</div>

<div id="main">
  <!-- LEFT NAV -->
  <div id="dept-nav">
    <div id="dept-nav-title">Salas</div>
    <button class="dept-all sel" id="btn-all" onclick="selectDept(null)">
      <span>🏢 Todas las salas</span>
    </button>
    <div id="dept-list"></div>
  </div>

  <!-- OFFICE CENTER -->
  <div id="office-wrap">
    <div id="conn-badge" class="err">⬤ conectando…</div>

    <!-- OVERVIEW: grid of room cards -->
    <div id="overview">
      <div id="overview-grid">
        <div style="color:var(--dim);font-size:11px;font-family:'Courier New',monospace">Cargando agentes desde Confluence…</div>
      </div>
    </div>

    <!-- SINGLE ROOM VIEW -->
    <div id="room-view">
      <div id="room-scene">
        <!-- Background image (PNG) -->
        <img id="room-bg-img" src="" alt=""/>
        <!-- Fallback background -->
        <div id="room-bg-fallback"></div>
        <!-- Sprites layer -->
        <div id="sprites-layer"></div>
        <!-- Room topbar -->
        <div id="room-topbar">
          <button id="back-btn" onclick="selectDept(null)">← Todas las salas</button>
          <div id="room-label"></div>
        </div>
        <!-- Agent info panel -->
        <div id="ap">
          <button id="ap-close" onclick="closePanel()">×</button>
          <div id="ap-dept"></div>
          <div id="ap-name"></div>
          <div id="ap-persona"></div>
          <div id="ap-desc"></div>
          <a id="ap-link" href="#" target="_blank">Ver en Confluence →</a>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT SIDEBAR -->
  <div id="sidebar">
    <div id="chat-hdr">
      <span>💬 Pregunta al equipo</span>
      <p>¿Quién hace X? ¿Qué hace el agente Y?</p>
    </div>
    <div id="messages"></div>
    <div id="inp-wrap">
      <textarea id="inp" rows="2" placeholder="Ej: ¿quién gestiona Kubernetes?"></textarea>
      <button id="send">↑</button>
    </div>
  </div>
</div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const DC={Cargas:'#22d3ee',Datos:'#a78bfa',Apps:'#1adb8a',Back:'#f0a020',Sistemas:'#4a8fff',Front:'#f472b6','':'#8890b0'};
function dc(d){return DC[d]||'#8890b0';}

const ROOM_FILES={Cargas:'cargas.png',Datos:'datos.png',Apps:'apps.png',Back:'back.png',Sistemas:'sistemas.png',Front:'front.png'};
const ROOM_DEFAULT='datos.png'; // fallback si no existe imagen específica
async function getRoomImg(dept){
  const file=ROOM_FILES[dept];
  if(file){const img=await loadImg('/assets/rooms/'+file);if(img)return{src:'/assets/rooms/'+file,img};}
  const def=await loadImg('/assets/rooms/'+ROOM_DEFAULT);
  return def?{src:'/assets/rooms/'+ROOM_DEFAULT,img:def}:null;
}
const ROOM_EMOJI={Cargas:'💧',Datos:'📊',Apps:'📱',Back:'⚙️',Sistemas:'🖥️',Front:'🎨','':'❓'};
const FALLBACK_BG={
  Cargas:'linear-gradient(135deg,#0d2228,#0a1820)',
  Datos: 'linear-gradient(135deg,#160d28,#100a1e)',
  Apps:  'linear-gradient(135deg,#0d2818,#0a1e14)',
  Back:  'linear-gradient(135deg,#281a0d,#1e140a)',
  Sistemas:'linear-gradient(135deg,#0d1828,#0a121e)',
  Front: 'linear-gradient(135deg,#28100d,#1e0c0a)',
  '':    'linear-gradient(135deg,#141418,#0e0e12)',
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let agents=[], selAgent=null, currentDept=null;
let chatHist=[], loading=false;
const imgCache={};

function loadImg(src){
  if(imgCache[src]) return imgCache[src];
  const p=new Promise(res=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>res(null);
    img.src=src;
  });
  imgCache[src]=p;
  return p;
}

// Preload all assets
function preload(){
  loadImg('/assets/sprites/default.png');
  Object.values(ROOM_FILES).forEach(f=>loadImg('/assets/rooms/'+f));
}

// ── OVERVIEW ──────────────────────────────────────────────────────────────────
function renderOverview(){
  const grid=document.getElementById('overview-grid');
  grid.innerHTML='';
  const depts=[...new Set(agents.map(a=>a.departamento||''))];
  if(depts.length===0){
    grid.innerHTML='<div style="color:var(--dim);font-size:11px;font-family:Courier New,monospace">Cargando agentes desde Confluence…</div>';
    return;
  }

  depts.forEach(dept=>{
    const dAgents=agents.filter(a=>(a.departamento||'')===dept);
    const dC=dc(dept);
    const card=document.createElement('div');
    card.className='room-card';
    card.style.borderColor=dC+'44';
    card.onclick=()=>selectDept(dept);

    // Check if room image exists
    const imgFile=ROOM_FILES[dept];
    const imgSrc=imgFile?'/assets/rooms/'+imgFile:null;

    // Load room image (with fallback to datos.png)
    getRoomImg(dept).then(result=>{
      if(result){
        const imgEl=document.createElement('img');
        imgEl.className='room-card-img';
        imgEl.src=result.src;
        imgEl.style.imageRendering='pixelated';
        const existing=card.querySelector('.room-card-img');
        if(existing) existing.replaceWith(imgEl);
        else{ const fb=card.querySelector('.room-card-fallback'); if(fb) card.replaceChild(imgEl,fb); else card.insertBefore(imgEl,card.firstChild); }
      }
    });

    // Fallback div (always add, remove if img loads)
    const fb=document.createElement('div');
    fb.className='room-card-fallback';
    fb.style.background=FALLBACK_BG[dept]||FALLBACK_BG[''];
    fb.innerHTML=`<span style="font-size:48px">${ROOM_EMOJI[dept]||'🏢'}</span>`;
    card.appendChild(fb);

    // Agent dots
    const dotsEl=document.createElement('div');
    dotsEl.className='room-card-dots';
    dAgents.slice(0,12).forEach(()=>{
      const d=document.createElement('div');
      d.className='room-dot';
      d.style.color=dC;d.style.background=dC;
      dotsEl.appendChild(d);
    });
    card.appendChild(dotsEl);

    // Bottom bar
    const bar=document.createElement('div');
    bar.className='room-card-bar';
    bar.innerHTML=`<span class="room-card-name" style="color:${dC}">${(dept||'Sin depto').toUpperCase()}</span><span class="room-card-cnt">${dAgents.length} agentes</span>`;
    card.appendChild(bar);

    grid.appendChild(card);
  });

  // Re-render overview cards with loaded images
  setTimeout(()=>{
    document.querySelectorAll('.room-card').forEach(card=>{
      const bar=card.querySelector('.room-card-bar');
      const deptName=bar?.querySelector('.room-card-name')?.textContent?.toLowerCase().replace(' ','');
      // check if img already cached
    });
  },500);
}


// ── ROOM VIEW ─────────────────────────────────────────────────────────────────
async function renderRoomView(){
  const dC=dc(currentDept);

  // Label
  const lbl=document.getElementById('room-label');
  lbl.textContent=(currentDept||'Sin depto').toUpperCase();
  lbl.style.color=dC;
  lbl.style.borderColor=dC+'66';

  // Background
  const imgFile=ROOM_FILES[currentDept];
  const imgSrc=imgFile?'/assets/rooms/'+imgFile:null;
  const bgImg=document.getElementById('room-bg-img');
  const bgFb=document.getElementById('room-bg-fallback');

  const roomImgResult = await getRoomImg(currentDept);
  if(roomImgResult){
    bgImg.src=roomImgResult.src;
    bgImg.classList.add('on');
    bgFb.classList.add('hidden');
  } else {
    bgImg.classList.remove('on');
    bgFb.classList.remove('hidden');
    bgFb.style.background=FALLBACK_BG[currentDept]||FALLBACK_BG[''];
    bgFb.innerHTML=`<span style="font-size:80px">${ROOM_EMOJI[currentDept]||'🏢'}</span>`;
  }

  // Sprites
  const spritesLayer=document.getElementById('sprites-layer');
  spritesLayer.innerHTML='';

  const roomAgents=agents.filter(a=>(a.departamento||'')===currentDept);
  const defaultSprite=await loadImg('/assets/sprites/default.png');

  // Grid positions: spread across the lower portion of the scene
  const cols=Math.ceil(Math.sqrt(roomAgents.length));
  const rows=Math.ceil(roomAgents.length/cols);
  const scene=document.getElementById('room-scene');
  const sceneW=scene.offsetWidth||window.innerWidth-430;
  const sceneH=scene.offsetHeight||window.innerHeight-30;

  // Sprite height: 22% of scene height
  const sprH=Math.round(sceneH*0.22);

  roomAgents.forEach(async(ag,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    // x: 15% to 85% spread, y: 50% to 88% spread
    const xPct=15+(col/(Math.max(cols-1,1)))*70;
    const yPct=50+(row/(Math.max(rows-1,1)))*36;

    // Try agent-specific sprite first
    const safeName=ag.nombre.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
    let sprite=await loadImg(`/assets/sprites/${safeName}.png`);
    if(!sprite) sprite=defaultSprite;

    const sprW=sprite?Math.round(sprH*(sprite.naturalWidth/sprite.naturalHeight)):sprH;

    const wrap=document.createElement('div');
    wrap.className='agent-wrap';
    wrap.style.left=xPct+'%';
    wrap.style.top=yPct+'%';
    wrap.style.setProperty('--glow',dC);
    wrap.style.zIndex=Math.round(yPct);
    wrap.dataset.nombre=ag.nombre;

    const img=document.createElement('img');
    img.className='agent-img';
    img.src=sprite?sprite.src:'/assets/sprites/default.png';
    img.width=sprW;
    img.height=sprH;
    img.style.animationDelay=(i*0.35)%2.5+'s';

    const nameEl=document.createElement('div');
    nameEl.className='agent-name';
    nameEl.style.color=dC;
    nameEl.style.borderColor=dC+'55';
    const shortName=ag.nombre.length>16?ag.nombre.slice(0,15)+'…':ag.nombre;
    nameEl.textContent=shortName;

    wrap.appendChild(img);
    wrap.appendChild(nameEl);
    wrap.addEventListener('click',e=>{e.stopPropagation();showPanel(ag);});
    spritesLayer.appendChild(wrap);

    // Apply selection state
    if(selAgent&&selAgent.nombre===ag.nombre) wrap.classList.add('sel');
  });

  // Click background to deselect
  scene.onclick=(e)=>{
    if(e.target===scene||e.target===bgImg||e.target===bgFb) closePanel();
  };
}

// ── SELECTION ─────────────────────────────────────────────────────────────────
function selectDept(d){
  currentDept=(d===null)?null:d;
  selAgent=null;
  document.getElementById('ap').classList.remove('on');

  const overview=document.getElementById('overview');
  const roomView=document.getElementById('room-view');

  if(currentDept===null){
    roomView.classList.remove('on');
    overview.style.display='grid';
  } else {
    overview.style.display='none';
    roomView.classList.add('on');
    renderRoomView();
  }

  buildDeptNav();
}

// ── AGENT PANEL ───────────────────────────────────────────────────────────────
function showPanel(ag){
  selAgent=ag;
  const dC=dc(ag.departamento);
  document.getElementById('ap').style.borderColor=dC+'88';
  document.getElementById('ap-dept').style.color=dC;
  document.getElementById('ap-dept').textContent=(ag.departamento||'Sin dpto').toUpperCase();
  document.getElementById('ap-name').textContent=ag.nombre;
  document.getElementById('ap-persona').textContent='👤 '+(ag.persona||'—');
  document.getElementById('ap-desc').textContent=ag.descripcion||'';
  const lk=document.getElementById('ap-link');
  if(ag.url){lk.href=ag.url;lk.style.display='inline';}else lk.style.display='none';
  document.getElementById('ap').classList.add('on');
  // Highlight selected, dim others
  document.querySelectorAll('.agent-wrap').forEach(el=>{
    if(el.dataset.nombre===ag.nombre){el.classList.add('sel');el.classList.remove('dimmed');}
    else{el.classList.remove('sel');el.classList.add('dimmed');}
  });
}
function closePanel(){
  selAgent=null;
  document.getElementById('ap').classList.remove('on');
  document.querySelectorAll('.agent-wrap').forEach(el=>{el.classList.remove('sel','dimmed');});
}

// ── DEPT NAV ──────────────────────────────────────────────────────────────────
function buildDeptNav(){
  const depts=[...new Set(agents.map(a=>a.departamento||''))];
  document.getElementById('btn-all').className='dept-all'+(currentDept===null?' sel':'');
  document.getElementById('dept-list').innerHTML=depts.map(d=>{
    const c=dc(d),cnt=agents.filter(a=>(a.departamento||'')===d).length;
    return`<button class="dept-btn${currentDept===d?' sel':''}" style="--dc:${c}" onclick="selectDept('${esc(d)}')">
      <div class="d-dot" style="background:${c}"></div>
      <div class="d-name${currentDept===d?' hi':''}">${esc(d||'Sin depto')}</div>
      <span class="d-cnt">${cnt}</span>
    </button>`;
  }).join('');
}
function updateLive(){
  const depts=[...new Set(agents.map(a=>a.departamento).filter(Boolean))].length;
  document.getElementById('live-txt').textContent=`${agents.length} agentes · ${depts} salas`;
}

// ── WEBSOCKET ─────────────────────────────────────────────────────────────────
let ws,retryT;
function connect(){
  ws=new WebSocket(`ws://${location.host}`);
  const b=document.getElementById('conn-badge');
  ws.onopen=()=>{b.textContent='⬤ conectado';b.className='ok';clearTimeout(retryT);};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='confluence_agents'){
      agents=m.agents;
      buildDeptNav();updateLive();
      renderOverview();
      if(currentDept!==null) renderRoomView();
    }
    updateLive();
  };
  ws.onclose=()=>{b.textContent='⬤ desconectado';b.className='err';retryT=setTimeout(connect,3000);};
}
async function loadAgents(){
  try{
    const r=await fetch('/api/confluence-agents');
    const d=await r.json();
    if(d.length){
      agents=d;
      buildDeptNav();updateLive();
      renderOverview();
    }
  }catch{}
}

// ── CHAT ──────────────────────────────────────────────────────────────────────
function pushMsg(role,content,name,color,isErr){
  const wrap=document.getElementById('messages'),div=document.createElement('div');
  div.className=`msg ${role}`;
  if(role==='assistant'){div.innerHTML=`<div class="msg-meta"><div class="msg-av" style="background:${(color||'#1c2035')}33;border:1px solid ${color||'#2a3050'}55">🏢</div><span class="msg-who" style="color:${color||'#1adb8a'}">${name||'Oficina'}</span></div><div class="msg-body${isErr?' msg-err':''}">${esc(content)}</div>`;}
  else{div.innerHTML=`<div class="msg-body">${esc(content)}</div>`;}
  wrap.appendChild(div);wrap.scrollTop=wrap.scrollHeight;return div;
}
async function sendMsg(){
  const el=document.getElementById('inp'),txt=el.value.trim();if(!txt||loading)return;
  el.value='';loading=true;document.getElementById('send').disabled=true;
  pushMsg('user',txt);chatHist.push({role:'user',content:txt});
  const list=agents.map(a=>`- "${a.nombre}" (${a.departamento||'?'}, ${a.persona||'?'}): ${a.descripcion}`).join('\n');
  const sys=`Eres el asistente de la Oficina Virtual VisualNacert. Conoces todos los agentes IA del equipo.\nAGENTES (${agents.length}):\n${list}\nResponde en español. Si preguntan quién hace algo, di nombre del agente, departamento y responsable. Sé conciso y útil.`;
  const ldiv=pushMsg('assistant','…','Oficina','#1adb8a');
  ldiv.querySelector('.msg-body').style.animation='blink 0.8s infinite';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,messages:chatHist.slice(-10)})});
    const d=await r.json();
    ldiv.querySelector('.msg-body').style.animation='';
    if(d.error){ldiv.querySelector('.msg-body').classList.add('msg-err');ldiv.querySelector('.msg-body').innerHTML=esc(d.error);}
    else{const rep=d.content?.find(b=>b.type==='text')?.text||'Sin respuesta.';ldiv.querySelector('.msg-body').innerHTML=esc(rep);chatHist.push({role:'assistant',content:rep});}
  }catch{ldiv.querySelector('.msg-body').classList.add('msg-err');ldiv.querySelector('.msg-body').innerHTML='❌ Error.';}
  loading=false;document.getElementById('send').disabled=false;
}
document.getElementById('send').onclick=sendMsg;
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

// ── BOOT ──────────────────────────────────────────────────────────────────────
pushMsg('assistant','👋 Bienvenido/a a la Oficina Virtual de VisualNacert.\n\nHaz clic en una sala para entrar. Clic en un agente para ver qué hace.','Oficina','#1adb8a');
preload();
loadAgents();
connect();
</script>
