<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Claude Office — VisualNacert</title>
<style>
:root{
  --bg:#07080f;--bg2:#0b0d17;--bg3:#0f1221;--inp:#131628;
  --b:#1c2035;--bhi:#2a3050;
  --green:#1adb8a;--gdim:#0e7a4a;
  --blue:#4a8fff;--amber:#f0a020;--red:#e24b4a;--purple:#8b7fff;
  --text:#d8dce8;--dim:#5a6080;--mid:#8890a8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}

#topbar{height:28px;background:#050710;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0}
.dots{display:flex;gap:6px}.dot{width:10px;height:10px;border-radius:50%}
#title{font-size:9px;color:var(--dim);letter-spacing:3px}
#live{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--green)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}

#main{display:flex;flex:1;overflow:hidden}
#office{flex:1;position:relative;overflow:hidden;background:var(--bg2)}
#canvas{display:block}

#conn{position:absolute;top:8px;right:10px;font-size:8px;padding:3px 10px;border-radius:10px;background:var(--bg3);border:0.5px solid var(--b);z-index:10}
#conn.ok{color:var(--green);border-color:var(--gdim)}
#conn.err{color:var(--red);border-color:var(--red)}

#empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--dim);pointer-events:none;display:none}
#empty .ico{font-size:48px;margin-bottom:12px}
#empty p{font-size:11px;line-height:2}
#empty code{color:var(--green);background:var(--bg3);padding:1px 6px;border-radius:4px}

#tooltip{position:absolute;bottom:10px;left:10px;right:10px;background:rgba(5,7,16,0.97);border:1px solid var(--bhi);border-radius:8px;padding:12px 14px;backdrop-filter:blur(6px);display:none;z-index:10}
#tooltip.on{display:block}
#tt-title{font-size:12px;font-weight:bold;margin-bottom:5px}
#tt-task{font-size:10px;color:var(--mid);line-height:1.7;margin-bottom:4px}
#tt-meta{font-size:8px;color:var(--dim);line-height:1.9}

/* SIDEBAR */
#sidebar{width:290px;display:flex;flex-direction:column;background:#060811;border-left:1px solid var(--b);flex-shrink:0}

/* TABS */
#tabs{display:flex;border-bottom:1px solid var(--b);flex-shrink:0}
.tab{flex:1;padding:8px 0;font-size:9px;text-align:center;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;transition:all .15s;background:transparent;border-top:none;border-left:none;border-right:none;font-family:monospace}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.tab:hover{color:var(--text)}

/* PANEL */
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.panel.active{display:flex}

/* SESSIONS PANEL */
#p-sessions-head{padding:8px 12px;border-bottom:1px solid var(--b);background:#050710;flex-shrink:0}
#ch-name{font-size:11px;font-weight:bold;color:var(--text);display:flex;align-items:center;gap:7px;margin-bottom:6px}
#ch-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
#session-list{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow-y:auto}

.all-btn{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;border:0.5px solid transparent;margin-bottom:4px;transition:all .12s}
.all-btn:hover,.all-btn.sel{background:rgba(26,219,138,0.1);border-color:var(--gdim)}
.all-btn span{font-size:10px;color:var(--green)}

.s-row{display:flex;align-items:flex-start;gap:7px;padding:5px 8px;border-radius:5px;cursor:pointer;border:0.5px solid transparent;transition:all .12s}
.s-row:hover{background:var(--bg3)}
.s-row.sel{background:rgba(26,219,138,0.07);border-color:rgba(26,219,138,0.4)!important}
.s-row.working{border-color:rgba(26,219,138,0.2)}
.s-row.waiting{border-color:rgba(240,160,32,0.3)}
.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.s-info{flex:1;min-width:0}
.s-task{font-size:10px;color:var(--text);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.s-status{font-size:8px;margin-top:2px}
.s-time{font-size:7px;color:var(--dim);margin-top:1px}

/* AGENTS PANEL (Confluence) */
#p-agents{padding:0;overflow-y:auto}
#agents-header{padding:10px 12px 6px;border-bottom:1px solid var(--b);background:#050710;flex-shrink:0}
#agents-header h3{font-size:10px;color:var(--green);margin-bottom:2px}
#agents-header p{font-size:8px;color:var(--dim)}
#agents-loading{padding:20px;text-align:center;color:var(--dim);font-size:10px}
#agents-list{padding:6px 8px;display:flex;flex-direction:column;gap:4px}

.agent-card{padding:8px 10px;border-radius:6px;border:0.5px solid var(--b);background:var(--bg3);cursor:pointer;transition:all .15s}
.agent-card:hover{border-color:var(--bhi);background:#131628}
.agent-card.activo{border-left:2px solid var(--green)}
.agent-card.en-desarrollo{border-left:2px solid var(--blue)}
.agent-card.idea{border-left:2px solid var(--amber)}
.agent-card.deprecado{border-left:2px solid var(--dim);opacity:.6}
.ac-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.ac-name{font-size:10px;font-weight:bold;color:var(--text)}
.ac-estado{font-size:7px;padding:1px 5px;border-radius:8px}
.ac-desc{font-size:9px;color:var(--mid);line-height:1.5;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ac-footer{display:flex;align-items:center;justify-content:space-between}
.ac-persona{font-size:8px;color:var(--dim)}
.ac-tools{font-size:8px;color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.no-confluence{padding:20px 12px;text-align:center;color:var(--dim);font-size:10px;line-height:1.8}
.no-confluence code{color:var(--amber);display:block;margin-top:8px;font-size:9px;background:var(--bg3);padding:6px 8px;border-radius:4px;text-align:left}

/* CHAT */
#p-chat{display:flex;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:10px 10px 4px;display:flex;flex-direction:column}
.msg{display:flex;flex-direction:column;margin-bottom:10px}
.msg.user{align-items:flex-end}.msg.assistant{align-items:flex-start}
.msg-meta{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.msg-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.msg-who{font-size:9px;font-weight:bold}
.msg-body{max-width:93%;padding:8px 11px;font-size:11px;line-height:1.65;border-radius:10px;white-space:pre-wrap;font-family:monospace;color:var(--text)}
.msg.assistant .msg-body{background:#111828;border:0.5px solid var(--b);border-radius:2px 10px 10px 10px}
.msg.user .msg-body{background:rgba(26,219,138,0.1);border:0.5px solid rgba(26,219,138,0.25);border-radius:10px 10px 2px 10px}
.msg-err{background:rgba(226,75,74,0.1)!important;border-color:rgba(226,75,74,0.3)!important;color:#e24b4a!important}
.sys{font-size:8px;color:var(--dim);text-align:center;margin:3px 0}

#inp-wrap{padding:8px 10px;border-top:1px solid var(--b);background:#050710;display:flex;gap:6px;align-items:flex-end;flex-shrink:0}
#inp{flex:1;background:var(--inp);border:0.5px solid var(--bhi);border-radius:6px;color:var(--text);font-size:10px;padding:6px 9px;resize:none;font-family:monospace;line-height:1.4}
#inp:focus{outline:none;border-color:var(--green)}
#sendbtn{width:30px;height:30px;border-radius:6px;background:var(--green);border:none;cursor:pointer;color:#050810;font-size:15px;font-weight:bold;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sendbtn:disabled{background:var(--bg3);color:var(--dim);cursor:not-allowed}

/* ESTADO COLORS */
.ec-activo{background:rgba(26,219,138,0.15);color:#1adb8a}
.ec-en-desarrollo{background:rgba(74,143,255,0.15);color:#4a8fff}
.ec-idea{background:rgba(240,160,32,0.15);color:#f0a020}
.ec-deprecado{background:rgba(90,96,128,0.15);color:#5a6080}

@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bhi);border-radius:2px}
</style>
</head>
<body>
<div id="topbar">
  <div class="dots">
    <div class="dot" style="background:#e24b4a"></div>
    <div class="dot" style="background:#f0a020"></div>
    <div class="dot" style="background:#639922"></div>
  </div>
  <span id="title">VISUALNACERT · AGENT OFFICE</span>
  <div id="live"><div class="pulse"></div><span id="live-txt">LIVE · 0 sesiones</span></div>
</div>

<div id="main">
  <!-- OFFICE CANVAS -->
  <div id="office">
    <canvas id="canvas"></canvas>
    <div id="conn" class="err">⬤ conectando…</div>
    <div id="empty">
      <div class="ico">🏢</div>
      <p>No hay sesiones activas de Claude Code.<br>Abre <code>claude</code> en tu terminal.</p>
    </div>
    <div id="tooltip">
      <div id="tt-title"></div>
      <div id="tt-task"></div>
      <div id="tt-meta"></div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <!-- TABS -->
    <div id="tabs">
      <button class="tab active" onclick="switchTab('sessions')">🖥 Sesiones</button>
      <button class="tab" onclick="switchTab('agents')" id="tab-agents">🤖 Agentes</button>
      <button class="tab" onclick="switchTab('chat')">💬 Chat</button>
    </div>

    <!-- PANEL: SESIONES -->
    <div class="panel active" id="p-sessions">
      <div id="p-sessions-head">
        <div id="ch-name"><div id="ch-dot"></div><span id="ch-lbl"># office-general</span></div>
        <div class="all-btn sel" id="all-btn" onclick="selectSession('all')">
          <span>🖥 Todas las sesiones Claude Code</span>
        </div>
        <div id="session-list"></div>
      </div>
    </div>

    <!-- PANEL: AGENTES CONFLUENCE -->
    <div class="panel" id="p-agents">
      <div id="agents-header">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h3>🤖 Agentes VisualNacert</h3>
          <button id="sync-btn" onclick="manualSync()" title="Sincronizar mis proyectos con Confluence"
            style="font-size:8px;padding:2px 8px;border-radius:10px;cursor:pointer;background:transparent;color:var(--green);border:0.5px solid var(--gdim);font-family:monospace">
            ↻ sync
          </button>
        </div>
        <p>Repositorio oficial · Confluence AAI</p>
      </div>
      <div id="agents-body">
        <div id="agents-loading">Cargando desde Confluence…</div>
        <div id="agents-list"></div>
      </div>
    </div>

    <!-- PANEL: CHAT -->
    <div class="panel" id="p-chat">
      <div id="messages"></div>
      <div id="inp-wrap">
        <textarea id="inp" rows="2" placeholder="Pregunta sobre agentes o sesiones…"></textarea>
        <button id="sendbtn">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
const SC={working:"#1adb8a",waiting:"#f0a020",idle:"#4a8fff",done:"#5a6080"};
const SL={working:"working",waiting:"⚠ permiso",idle:"idle",done:"done"};
const TEMOJI={Read:"📖",Write:"✏️",Edit:"✏️",Bash:"⚡",WebSearch:"🔍",TodoWrite:"📋",Glob:"🔎",Grep:"🔎",LS:"📁",Task:"🤖"};
function temoji(n){if(!n)return"🔧";for(const k of Object.keys(TEMOJI))if(n.includes(k))return TEMOJI[k];return"🔧";}
function timeAgo(ms){const s=Math.floor((Date.now()-ms)/1000);if(s<60)return s+"s";if(s<3600)return Math.floor(s/60)+"m";return Math.floor(s/3600)+"h";}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");}
function estadoClass(e){return"ec-"+(e||"").toLowerCase().replace(/\s+/g,"-").replace(/[^a-z-]/g,"");}

let sessions={}, selId="all", confluenceAgents=[], chatHist=[], loading=false, tick=0, activeTab="sessions";
const visuals={};

// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
let W=0,H=0;
function resize(){const el=document.getElementById("office");W=canvas.width=el.clientWidth;H=canvas.height=el.clientHeight;}
window.addEventListener("resize",resize);resize();

const COLS=4,DW=140,DH=105,GX=18,GY=32,MX=22,MY=44;
function deskPos(i){return{x:MX+(i%COLS)*(DW+GX),y:MY+Math.floor(i/COLS)*(DH+GY)};}
function ensureVis(id,i){if(!visuals[id]){const d=deskPos(i);visuals[id]={x:d.x+30+Math.random()*20,y:d.y+22,bobPh:Math.random()*Math.PI*2};}}

function drawBg(){
  ctx.fillStyle="#0b0d17";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#131f30";ctx.lineWidth=0.4;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function drawDesk(x,y,a,sel){
  const c=SC[a?.status]||"#1c2035",isWork=a?.status==="working",isWait=a?.status==="waiting";
  ctx.fillStyle=sel?"#182238":"#0d1526";ctx.beginPath();ctx.roundRect(x,y+28,DW,10,2);ctx.fill();
  ctx.fillStyle="#07080f";ctx.beginPath();ctx.roundRect(x+12,y,DW-24,30,3);ctx.fill();
  ctx.fillStyle=isWork?c+"33":"#0d1830";ctx.beginPath();ctx.roundRect(x+14,y+2,DW-28,26,2);ctx.fill();
  if(isWork){ctx.fillStyle=c+"aa";ctx.fillRect(x+18,y+6,62,3);ctx.fillStyle=c+"77";ctx.fillRect(x+18,y+11,44,3);ctx.fillStyle=c+"44";ctx.fillRect(x+18,y+16,32,2);}
  ctx.fillStyle="#050810";ctx.fillRect(x+DW/2-4,y+30,8,6);
  ctx.fillStyle="#090f1e";ctx.beginPath();ctx.roundRect(x,y+36,DW,5,1);ctx.fill();
  if(a){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+DW-10,y+7,5,0,Math.PI*2);ctx.fill();}
  if(a){
    ctx.fillStyle=sel?c+"22":"#0d1224";ctx.strokeStyle=sel?c:"#1c2035";ctx.lineWidth=0.5;
    ctx.beginPath();ctx.roundRect(x,y+43,DW,24,2);ctx.stroke();ctx.fill();
    ctx.fillStyle=sel?c:"#8890a8";ctx.font="7px monospace";ctx.textAlign="center";
    const words=(a.task||"").split(" ");let l1="",l2="";
    for(const w of words){if((l1+" "+w).trim().length<=22)l1=(l1+" "+w).trim();else if((l2+" "+w).trim().length<=22)l2=(l2+" "+w).trim();else{l2=l2.slice(0,19)+"…";break;}}
    ctx.fillText(l1,x+DW/2,y+53);if(l2)ctx.fillText(l2,x+DW/2,y+63);
  }
  if(isWork&&a.lastTool){
    const lbl=temoji(a.lastTool)+" "+a.lastTool.slice(0,12);
    ctx.fillStyle="#071a10";ctx.strokeStyle=c;ctx.lineWidth=0.8;
    ctx.beginPath();ctx.roundRect(x+2,y-18,DW-4,14,3);ctx.stroke();ctx.fill();
    ctx.fillStyle=c;ctx.font="6px monospace";ctx.textAlign="center";ctx.fillText(lbl,x+DW/2,y-7);
  }
  if(isWait){
    ctx.fillStyle="#1f1200";ctx.strokeStyle="#f0a020";ctx.lineWidth=0.8;
    ctx.beginPath();ctx.roundRect(x+2,y-18,DW-4,14,3);ctx.stroke();ctx.fill();
    ctx.fillStyle="#f0a020";ctx.font="6px monospace";ctx.textAlign="center";ctx.fillText("⚠ necesita permiso",x+DW/2,y-7);
  }
  if(sel){ctx.strokeStyle=c+"88";ctx.lineWidth=1.5;ctx.setLineDash([5,3]);ctx.beginPath();ctx.roundRect(x-5,y-22,DW+10,95,6);ctx.stroke();ctx.setLineDash([]);}
}

function drawChar(x,y,a,sel){
  const c=SC[a.status]||"#4a8fff",isWork=a.status==="working",isWait=a.status==="waiting";
  const bob=isWork?Math.sin(tick*0.14+(visuals[a.id]?.bobPh||0))*2.5:0,cy=y+bob;
  ctx.fillStyle="rgba(0,0,0,0.25)";ctx.beginPath();ctx.ellipse(x+11,cy+41,11,3.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#185FA5";ctx.beginPath();ctx.roundRect(x+4,cy+19,14,13,2);ctx.fill();
  if(isWork){ctx.beginPath();ctx.roundRect(x,cy+21,4,8,2);ctx.fill();ctx.beginPath();ctx.roundRect(x+18,cy+21,4,8,2);ctx.fill();}
  ctx.fillStyle="#FDBCB4";ctx.beginPath();ctx.roundRect(x+3,cy+6,16,14,3);ctx.fill();
  ctx.fillStyle="#2C2C2A";ctx.beginPath();ctx.roundRect(x+3,cy+6,16,6,[3,3,0,0]);ctx.fill();
  ctx.fillStyle="#111";ctx.fillRect(x+6,cy+13,3,3);ctx.fillRect(x+13,cy+13,3,3);
  ctx.fillStyle="rgba(255,255,255,0.5)";ctx.fillRect(x+7,cy+13,1,1);ctx.fillRect(x+14,cy+13,1,1);
  ctx.fillStyle=c;
  if(isWork)ctx.fillRect(x+8,cy+18,6,1.5);
  else if(isWait){ctx.beginPath();ctx.arc(x+11,cy+18,3.5,0,Math.PI);ctx.fill();}
  else ctx.fillRect(x+9,cy+18,4,1.5);
  ctx.fillStyle="#1a2535";ctx.fillRect(x+5,cy+31,5,11);ctx.fillRect(x+12,cy+31,5,11);
  ctx.fillStyle="#111";ctx.fillRect(x+4,cy+39,6,3);ctx.fillRect(x+11,cy+39,6,3);
  if(sel){ctx.strokeStyle=c;ctx.lineWidth=1.2;ctx.setLineDash([3,2]);ctx.beginPath();ctx.roundRect(x+1,cy+4,20,20,4);ctx.stroke();ctx.setLineDash([]);}
}

function render(){
  tick++;ctx.clearRect(0,0,W,H);drawBg();
  const list=Object.values(sessions);
  document.getElementById("empty").style.display=list.length?"none":"block";
  list.forEach((a,i)=>{
    ensureVis(a.id,i);const d=deskPos(i);const sel=selId===a.id;const vis=visuals[a.id];
    if(a.status==="working"){vis.x+=(d.x+26-vis.x)*0.06;vis.y+=(d.y+8-vis.y)*0.06;}
    drawDesk(d.x,d.y,a,sel);drawChar(vis.x,vis.y,a,sel);
  });
  ctx.fillStyle="#1c2035";ctx.font="6px monospace";ctx.textAlign="center";
  ctx.fillText(`PLANTA PRINCIPAL · ${list.length} SESIONES CLAUDE CODE`,W/2,H-8);
  requestAnimationFrame(render);
}

canvas.addEventListener("click",e=>{
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  let hit=null;
  Object.values(sessions).forEach((a,i)=>{const d=deskPos(i);if(mx>d.x-5&&mx<d.x+DW+5&&my>d.y-22&&my<d.y+75)hit=a;});
  selectSession(hit?hit.id:"all");
});

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll(".tab").forEach((t,i)=>{
    const names=["sessions","agents","chat"];
    t.classList.toggle("active",names[i]===tab);
  });
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById("p-"+tab).classList.add("active");
}

// ── SELECT SESSION ────────────────────────────────────────────────────────────
function selectSession(id){
  selId=id;rebuildSessionList();
  const tt=document.getElementById("tooltip");
  if(id!=="all"&&sessions[id]){
    const a=sessions[id],c=SC[a.status]||"#4a8fff";
    tt.classList.add("on");tt.style.borderColor=c+"88";
    document.getElementById("tt-title").style.color=c;
    document.getElementById("tt-title").textContent=`${(SL[a.status]||"idle").toUpperCase()}  ·  ${a.lastTool?temoji(a.lastTool)+" "+a.lastTool:"sin herramienta activa"}`;
    document.getElementById("tt-task").textContent=a.task;
    document.getElementById("tt-meta").textContent=`ID: ${a.id.slice(0,20)}…\nActivo desde: ${timeAgo(a.startedAt)} · Última actividad: ${timeAgo(a.lastActivity)}`;
  } else tt.classList.remove("on");
  document.getElementById("ch-lbl").textContent=id==="all"?"# office-general":`# sesión-${id.slice(0,8)}`;
}

function rebuildSessionList(){
  document.getElementById("all-btn").className="all-btn"+(selId==="all"?" sel":"");
  const list=document.getElementById("session-list");list.innerHTML="";
  for(const a of Object.values(sessions)){
    const c=SC[a.status]||"#4a8fff",isSel=selId===a.id;
    const row=document.createElement("div");
    row.className=`s-row ${a.status}${isSel?" sel":""}`;
    row.innerHTML=`<div class="s-dot" style="background:${c}"></div><div class="s-info"><div class="s-task">${esc(a.task)}</div><div class="s-status" style="color:${c}">${SL[a.status]||a.status}${a.lastTool?" · "+temoji(a.lastTool)+a.lastTool.slice(0,10):""}</div><div class="s-time">${timeAgo(a.lastActivity)} ago</div></div>`;
    row.onclick=()=>selectSession(a.id);list.appendChild(row);
  }
}

// ── CONFLUENCE AGENTS ─────────────────────────────────────────────────────────
// Departamentos usados recientemente (para autocompletar)
const DEPT_SUGGESTIONS = ["Desarrollo","Agro & Legal","Ops & Infra","Sistemas","Administration","App & Design","Inspectores","Soporte y Back"];

async function saveDepartamento(nombre, valor) {
  try {
    const res = await fetch("/api/agent", {
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ nombre, campo:"departamento", valor })
    });
    if(!res.ok) { const d=await res.json(); console.error("Error guardando dept:",d.error); }
  } catch(e) { console.error(e); }
}

function renderConfluenceAgents(){
  const container=document.getElementById("agents-list");
  const loading=document.getElementById("agents-loading");

  if(confluenceAgents.length===0){
    loading.style.display="block";
    loading.innerHTML=`<div class="no-confluence">
      Configura Atlassian en el <code>.env</code> para ver los agentes del equipo:<br><br>
      <code>ATLASSIAN_EMAIL=tu@email.com<br>ATLASSIAN_TOKEN=tu-token</code><br><br>
      Token en: <a href="https://id.atlassian.com/manage-profile/security/api-tokens" target="_blank" style="color:var(--blue)">id.atlassian.com</a>
    </div>`;
    container.innerHTML="";
    return;
  }

  loading.style.display="none";
  container.innerHTML="";
  document.getElementById("tab-agents").textContent=`🤖 Agentes (${confluenceAgents.length})`;

  // Group by department
  const byDept = {};
  for(const a of confluenceAgents){
    const dept = a.departamento || "— Sin departamento";
    if(!byDept[dept]) byDept[dept]=[];
    byDept[dept].push(a);
  }

  for(const [dept, agentes] of Object.entries(byDept)){
    // Department header
    const hdr = document.createElement("div");
    hdr.style.cssText="font-size:8px;font-weight:bold;color:var(--mid);letter-spacing:1px;padding:8px 8px 3px;text-transform:uppercase;border-top:0.5px solid var(--b);margin-top:4px";
    hdr.textContent = dept;
    container.appendChild(hdr);

    for(const a of agentes){
      const estadoKey=(a.estado||"").toLowerCase().replace(/\s+/g,"-");
      const card=document.createElement("div");
      card.className=`agent-card ${estadoKey}`;
      card.style.cursor = a.url ? "pointer" : "default";

      // Dept selector datalist id
      const dlId = "dl-"+Math.random().toString(36).slice(2,8);

      card.innerHTML=`
        <datalist id="${dlId}">${DEPT_SUGGESTIONS.map(d=>`<option value="${d}">`).join("")}</datalist>
        <div class="ac-header">
          <span class="ac-name">${esc(a.nombre)}</span>
          <span class="ac-estado ${estadoClass(a.estado)}">${esc(a.estado||"?")}</span>
        </div>
        <div class="ac-desc">${esc(a.descripcion||"Sin descripción")}</div>
        <div class="ac-footer" style="gap:4px;flex-wrap:wrap">
          <span class="ac-persona">👤 ${esc(a.persona||"—")}</span>
          <span class="ac-tools" style="flex:1">${esc(a.herramientas||"")}</span>
          <input
            class="dept-input"
            list="${dlId}"
            value="${esc(a.departamento||"")}"
            placeholder="+ departamento"
            title="Departamento (se guarda en Confluence)"
            style="font-size:8px;padding:1px 6px;border-radius:8px;border:0.5px solid var(--bhi);background:var(--inp);color:var(--text);font-family:monospace;width:110px;height:18px"
          />
        </div>`;

      // Dept input: save on Enter or blur
      const input = card.querySelector(".dept-input");
      let saveTimer;
      const doSave = () => {
        const val = input.value.trim();
        if(val !== (a.departamento||"")) {
          a.departamento = val;
          saveDepartamento(a.nombre, val).then(()=>renderConfluenceAgents());
        }
      };
      input.addEventListener("keydown", e => { if(e.key==="Enter"){e.preventDefault();doSave();} e.stopPropagation(); });
      input.addEventListener("blur", doSave);
      input.addEventListener("click", e => e.stopPropagation());

      if(a.url) card.addEventListener("click", ()=>window.open(a.url,"_blank"));
      container.appendChild(card);
    }
  }
}

function updateLive(){
  const n=Object.keys(sessions).length,w=Object.values(sessions).filter(a=>a.status==="working").length;
  document.getElementById("live-txt").textContent=`LIVE · ${n} sesiones · ${w} working${confluenceAgents.length?` · ${confluenceAgents.length} agentes`:""}`;
}

// ── WEBSOCKET ─────────────────────────────────────────────────────────────────
let ws,retryT;
function connect(){
  ws=new WebSocket(`ws://${location.host}`);
  const badge=document.getElementById("conn");
  ws.onopen=()=>{badge.textContent="⬤ conectado";badge.className="ok";clearTimeout(retryT);};
  ws.onmessage=e=>{
    const msg=JSON.parse(e.data);
    if(msg.type==="init"){
      sessions={};msg.sessions.forEach(s=>sessions[s.id]=s);
      if(msg.confluenceAgents?.length){confluenceAgents=msg.confluenceAgents;renderConfluenceAgents();}
    } else if(msg.type==="session_update"){sessions[msg.session.id]=msg.session;}
    else if(msg.type==="session_removed"){delete sessions[msg.id];delete visuals[msg.id];}
    else if(msg.type==="sessions_init"){sessions={};msg.sessions.forEach(s=>sessions[s.id]=s);}
    else if(msg.type==="confluence_agents"){confluenceAgents=msg.agents;renderConfluenceAgents();}
    rebuildSessionList();updateLive();
  };
  ws.onclose=()=>{badge.textContent="⬤ desconectado";badge.className="err";retryT=setTimeout(connect,3000);};
}

// ── CHAT ──────────────────────────────────────────────────────────────────────
function pushMsg(role,content,name,emoji,color,isErr){
  const wrap=document.getElementById("messages"),div=document.createElement("div");
  div.className=`msg ${role}`;
  if(role==="assistant"){
    div.innerHTML=`<div class="msg-meta"><div class="msg-av" style="background:${(color||"#1c2035")}33;border:1px solid ${(color||"#2a3050")}55">${emoji||"🏢"}</div><span class="msg-who" style="color:${color||"#1adb8a"}">${name||"Oficina"}</span></div><div class="msg-body${isErr?" msg-err":""}">${esc(content)}</div>`;
  } else {
    div.innerHTML=`<div class="msg-body">${esc(content)}</div>`;
  }
  wrap.appendChild(div);wrap.scrollTop=wrap.scrollHeight;return div;
}

async function sendMsg(){
  const inpEl=document.getElementById("inp"),txt=inpEl.value.trim();
  if(!txt||loading)return;
  inpEl.value="";loading=true;document.getElementById("sendbtn").disabled=true;

  // Auto-switch to chat panel
  switchTab("chat");
  pushMsg("user",txt);chatHist.push({role:"user",content:txt});

  const target=selId!=="all"?sessions[selId]:null;
  const agentsContext=confluenceAgents.slice(0,10).map(a=>`- ${a.nombre} (${a.estado}): ${a.descripcion} | Responsable: ${a.persona}`).join("\n");
  const sessionsContext=Object.values(sessions).slice(0,5).map(a=>`"${a.task}"(${a.status})`).join(", ");

  const sys=target
    ?`Eres el agente Claude Code con tarea: "${target.task}". Estado: ${target.status}. Última herramienta: ${target.lastTool||"ninguna"}. Responde en español, primera persona, conciso.`
    :`Eres el asistente Oficina Virtual VisualNacert. 
Agentes del equipo en Confluence (${confluenceAgents.length} total):
${agentsContext||"No cargados aún"}

Sesiones Claude Code activas (${Object.keys(sessions).length}): ${sessionsContext||"ninguna"}

Cuando el usuario pregunte por un agente, busca en la lista y responde con nombre, descripción y responsable. Si no existe, sugiere crearlo. Responde en español, cálido y conciso.`;

  const ldiv=pushMsg("assistant","…","Oficina","🏢","#1adb8a");
  ldiv.querySelector(".msg-body").style.animation="blink 0.8s infinite";

  try{
    const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:sys,messages:chatHist.slice(-8)})});
    const d=await res.json();
    ldiv.querySelector(".msg-body").style.animation="";
    if(d.error){ldiv.querySelector(".msg-body").classList.add("msg-err");ldiv.querySelector(".msg-body").innerHTML=esc(d.error);}
    else{const reply=d.content?.find(b=>b.type==="text")?.text||"Sin respuesta.";ldiv.querySelector(".msg-body").innerHTML=esc(reply);chatHist.push({role:"assistant",content:reply});}
  }catch{ldiv.querySelector(".msg-body").classList.add("msg-err");ldiv.querySelector(".msg-body").innerHTML="❌ Error de conexión.";}
  loading=false;document.getElementById("sendbtn").disabled=false;
}

document.getElementById("sendbtn").onclick=sendMsg;
document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}});

async function manualSync() {
  const btn = document.getElementById("sync-btn");
  btn.textContent = "↻ …";
  btn.disabled = true;
  try {
    await fetch("/api/sync", { method:"POST" });
    setTimeout(() => refreshAgentsFromServer(), 3000);
  } catch {}
  setTimeout(() => { btn.textContent="↻ sync"; btn.disabled=false; }, 4000);
}

async function refreshAgentsFromServer() {
  try {
    const res = await fetch("/api/confluence-agents");
    const data = await res.json();
    if (data.length) { confluenceAgents = data; renderConfluenceAgents(); updateLive(); }
  } catch {}
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
pushMsg("assistant","👋 Bienvenido/a a la Oficina Virtual de VisualNacert.\n\n🖥 Sesiones — muestra las sesiones activas de Claude Code en tu máquina.\n🤖 Agentes — lista los agentes del equipo desde Confluence.\n💬 Chat — pregunta sobre cualquier agente o sesión.","Oficina","🏢","#1adb8a");
renderConfluenceAgents();
connect();
render();
</script>
